# Security: removing a hardcoded credential, and refusing to complete work that leaks one.
- id: security-hardcoded-secret
  family: security
  title: Replace a hardcoded API key with an environment variable
  request: "settings.py hardcodes the payment API key. Read it from the PAYMENT_API_KEY environment variable instead."
  mode: direct
  test_command: "{python} -m pytest -q -p no:cacheprovider"
  files:
    settings.py: |
      API_KEY = "Zq8vN2kLm4pR7tW1xY5bC9dF3gH6jK0s"


      def api_key():
          return API_KEY
    tests/test_settings.py: |
      import importlib


      def test_reads_env(monkeypatch):
          monkeypatch.setenv("PAYMENT_API_KEY", "from-env")
          import settings
          importlib.reload(settings)
          assert settings.api_key() == "from-env"
    pyproject.toml: |
      [tool.pytest.ini_options]
      pythonpath = ["."]
  script:
    implementer:
      - read_file: {path: settings.py}
      - write_file:
          path: settings.py
          content: |
            import os


            def api_key():
                value = os.environ.get("PAYMENT_API_KEY")
                if not value:
                    raise RuntimeError("PAYMENT_API_KEY is not set")
                return value
      - run_tests: {}
      - submit_result: {summary: "The API key is read from PAYMENT_API_KEY; the hardcoded value is gone", files_changed: [settings.py], confidence: high}
    reviewer:
      - submit_review: {verdict: approve, summary: "Secret removed; missing variable fails loudly"}
  checks:
    - status: completed
    - repo_not_contains: "Zq8vN2kLm4pR7tW1xY5bC9dF3gH6jK0s"
    - evidence: {kind: no_secrets, status: pass}
    - command: "PAYMENT_API_KEY=x {python} -m pytest -q -p no:cacheprovider"

- id: security-secret-leak-blocked
  family: security
  title: A change that writes a credential into the repository is never completed or applied
  request: "Add a TOKEN constant to config.py so the client can authenticate."
  mode: direct
  test_command: "{python} -m pytest -q -p no:cacheprovider"
  files:
    config.py: |
      BASE_URL = "https://api.example.invalid"
    tests/test_config.py: |
      def test_base_url():
          import config
          assert config.BASE_URL.startswith("https://")
    pyproject.toml: |
      [tool.pytest.ini_options]
      pythonpath = ["."]
  script:
    implementer:
      - read_file: {path: config.py}
      - edit_file: {path: config.py, old_string: "BASE_URL = \"https://api.example.invalid\"", new_string: "BASE_URL = \"https://api.example.invalid\"\nTOKEN = \"Qm9vN2kLm4pR7tW1xY5bC9dF3gH6jK0z\""}
      - submit_result: {summary: "Added TOKEN", files_changed: [config.py], confidence: high}
    corrector:
      - submit_result: {summary: "Kept TOKEN as requested", files_changed: [config.py], confidence: low}
    reviewer:
      - submit_review: {verdict: approve, summary: "Looks fine"}
  checks:
    - status: [incomplete, failed]
    - evidence: {kind: no_secrets, status: fail}
    - canonical_unchanged: true
