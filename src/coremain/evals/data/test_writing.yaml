# Test writing: cover an untested module; the new tests must pass and must kill injected mutants.
- id: tests-for-untested-module
  family: test-writing
  title: Write meaningful tests for an untested money-parsing module (mutation-checked)
  request: >-
    utils/money.py has no tests. Write pytest tests in tests/test_money.py that cover parse_amount
    (plain numbers, a leading $, thousands separators, one-digit cents, negative and
    accounting-style "(3.99)" amounts, and ValueError for malformed input) and format_cents
    (including negative amounts). Do not change utils/money.py.
  mode: direct
  test_command: "{python} -m pytest -q -p no:cacheprovider"
  files:
    utils/__init__.py: ""
    utils/money.py: |
      """Parse user-entered money amounts into integer cents and format them back."""

      from __future__ import annotations

      import re

      _AMOUNT = re.compile(r"(?P<whole>\d{1,3}(?:,\d{3})+|\d+)(?:\.(?P<frac>\d{1,2}))?")


      def parse_amount(text: str) -> int:
          """Parse "12", "$1,234.50", "-3.99" or "(3.99)" into integer cents.

          A leading minus or surrounding parentheses (accounting style) mean a negative amount.
          Raises ValueError for anything else.
          """
          cleaned = text.strip()
          negative = False
          if cleaned.startswith("(") and cleaned.endswith(")"):
              negative, cleaned = True, cleaned[1:-1].strip()
          elif cleaned.startswith("-"):
              negative, cleaned = True, cleaned[1:].strip()
          cleaned = cleaned.removeprefix("$")
          match = _AMOUNT.fullmatch(cleaned)
          if match is None:
              raise ValueError(f"not a money amount: {text!r}")
          cents = int(match["whole"].replace(",", "")) * 100 + int((match["frac"] or "").ljust(2, "0"))
          return -cents if negative else cents


      def format_cents(cents: int) -> str:
          """Display form of an amount in cents: 123450 -> "$1,234.50", -399 -> "-$3.99"."""
          sign = "-" if cents < 0 else ""
          whole, frac = divmod(abs(cents), 100)
          return f"{sign}${whole:,}.{frac:02d}"
    utils/strings.py: |
      def initials(name: str) -> str:
          return "".join(part[0].upper() for part in name.split() if part)
    tests/test_strings.py: |
      from utils.strings import initials


      def test_initials():
          assert initials("ada  lovelace") == "AL"
    pyproject.toml: |
      [project]
      name = "ledger-utils"
      version = "0.9.0"

      [tool.pytest.ini_options]
      pythonpath = ["."]
  script:
    implementer:
      - [{read_file: {path: utils/money.py}}, {list_dir: {path: tests}}, {read_file: {path: tests/test_strings.py}}]
      - write_file:
          path: tests/test_money.py
          content: |
            import pytest

            from utils.money import format_cents, parse_amount


            @pytest.mark.parametrize(
                ("text", "cents"),
                [
                    ("12", 1200),
                    ("  7.25 ", 725),
                    ("$3.99", 399),
                    ("1,234.50", 123450),
                    ("$12,000", 1200000),
                    ("1.5", 150),
                ],
            )
            def test_parse_positive_amounts(text, cents):
                assert parse_amount(text) == cents


            @pytest.mark.parametrize(("text", "cents"), [("-3.99", -399), ("(3.99)", -399), ("-$1,000", -100000)])
            def test_parse_negative_and_accounting_amounts(text, cents):
                assert parse_amount(text) == cents


            @pytest.mark.parametrize("text", ["", "abc", "1,23", "1.234", "$", "12.3.4", "(5"])
            def test_parse_rejects_malformed_input(text):
                with pytest.raises(ValueError):
                    parse_amount(text)


            @pytest.mark.parametrize(("cents", "text"), [(0, "$0.00"), (5, "$0.05"), (123450, "$1,234.50"), (-399, "-$3.99")])
            def test_format_cents(cents, text):
                assert format_cents(cents) == text


            def test_format_then_parse_round_trips():
                for cents in (0, 1, 99, 100, 123456, -250):
                    assert parse_amount(format_cents(cents)) == cents
      - run_tests: {}
      - submit_result:
          summary: "Added tests/test_money.py: parametrized tests for positive, negative and accounting-style amounts, malformed input, format_cents (including negatives) and a format/parse round trip. utils/money.py is unchanged; the suite passes."
          files_changed: [tests/test_money.py]
          tests_added_or_changed: [tests/test_money.py]
          confidence: high
    reviewer:
      - read_file: {path: tests/test_money.py}
      - submit_review: {verdict: approve, summary: "Tests cover each documented input form, the error path and formatting; the round trip guards consistency."}
  checks:
    - status: completed
    - min_level: strong
    - file_exists: tests/test_money.py
    - file_matches: {path: tests/test_money.py, regex: '(?s)^\s*def test_\w+.*?^\s*def test_\w+.*?^\s*def test_\w+'}
    - command: "{python} -m pytest -q -p no:cacheprovider"
    # Each injected bug in utils/money.py must make the new tests fail.
    - command:
        run: |
          {python} - <<'EOF'
          import shutil, subprocess, sys, tempfile
          from pathlib import Path
          MUTANTS = {
              "sign dropped": ("return -cents if negative else cents", "return cents"),
              "one-digit cents": ('.ljust(2, "0")', '.rjust(2, "0")'),
              "malformed accepted": ('raise ValueError(f"not a money amount: {text!r}")', "return 0"),
              "format sign dropped": ('sign = "-" if cents < 0 else ""', 'sign = ""'),
          }
          survivors = []
          def run_tests(repo):
              return subprocess.run(
                  [sys.executable, "-m", "pytest", "-q", "-x", "-p", "no:cacheprovider", "tests/test_money.py"],
                  cwd=repo, capture_output=True,
              ).returncode
          # Baseline: the tests exist and pass on the real module; a kill must be a test failure
          # (exit 1), not a collection/usage error.
          assert run_tests(".") == 0, "tests/test_money.py does not pass on the unmodified module"
          for name, (old, new) in MUTANTS.items():
              with tempfile.TemporaryDirectory() as tmp:
                  repo = Path(tmp) / "repo"
                  shutil.copytree(".", repo, ignore=shutil.ignore_patterns(".git", "__pycache__"))
                  target = repo / "utils" / "money.py"
                  source = target.read_text()
                  assert source.count(old) == 1, f"mutation anchor missing for {name!r} (utils/money.py changed?)"
                  target.write_text(source.replace(old, new))
                  if run_tests(repo) != 1:
                      survivors.append(name)
          assert not survivors, f"mutants not detected by tests/test_money.py: {survivors}"
          print(f"killed {len(MUTANTS)}/{len(MUTANTS)} mutants")
          EOF
        expect_output: "killed 4/4 mutants"
    - changed_only: [tests/*.py]
